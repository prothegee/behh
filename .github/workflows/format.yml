name: format

# keep pull requests consistent: on every pr, run clang-format.sh and commit any
# fixes back to the pr branch. the commit goes to the pr branch, not main, so the
# main ruleset does not apply. this needs the repo workflow token set to read and
# write (settings -> actions -> general -> workflow permissions).
#
# note: a push by GITHUB_TOKEN does not re-trigger workflows, so the auto fix
# commit will not start another format run (no loop). fork pull requests get a
# read only token and cannot be auto fixed, that is expected.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    # ubuntu 26.04 (resolute) ships clang-format-22 in apt, matching the local version.
    runs-on: ubuntu-26.04
    steps:
      - name: checkout pr branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-22

      - name: run formatter
        env:
          CLANG_FORMAT: clang-format-22
        run: ./clang-format.sh

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply clang-format" || exit 0
          git push
